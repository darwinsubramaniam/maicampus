name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --all-groups --python ${{ env.PYTHON_VERSION }}

      - name: Build macOS app
        run: uv run --python ${{ env.PYTHON_VERSION }} flet build macos -v

      - name: Archive macOS build
        run: |
          cd build/macos
          zip -r ../../maicampus-macos.zip .
          cd ../..

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: maicampus-macos
          path: maicampus-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ env.PYTHON_VERSION }}

      - name: Build Windows app
        run: uv run --python ${{ env.PYTHON_VERSION }} flet build windows -v

      - name: Archive Windows build
        run: Compress-Archive -Path build/windows/* -DestinationPath maicampus-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: maicampus-windows
          path: maicampus-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libmpv-dev mpv

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ env.PYTHON_VERSION }}

      - name: Build Linux app
        run: uv run --python ${{ env.PYTHON_VERSION }} flet build linux -v

      - name: Archive Linux build
        run: tar -czf maicampus-linux.tar.gz -C build/linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: maicampus-linux
          path: maicampus-linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            maicampus-macos/maicampus-macos.zip
            maicampus-windows/maicampus-windows.zip
            maicampus-linux/maicampus-linux.tar.gz
          generate_release_notes: true
