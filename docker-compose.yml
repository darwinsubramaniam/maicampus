# MAiCampus full stack: Postgres 18 + FastAPI mock backend + the Flet app (web).
#   docker compose up --build
# Web app: http://localhost:8550      Mock API: http://localhost:28000  (docs at /docs)
# Postgres has no host port (internal to the compose network only).

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: maicampus
      POSTGRES_PASSWORD: maicampus
      POSTGRES_DB: maicampus
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port — Postgres stays internal to the compose network (shared-server friendly).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maicampus -d maicampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./mock_server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://maicampus:maicampus@db:5432/maicampus
    # Mock API exposed on host port 28000 (container still listens on 8000).
    ports:
      - "28000:8000"

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    environment:
      # Flet runs Python server-side, so reach the API by its compose service name.
      MAICAMPUS_API_BASE: http://api:8000
    ports:
      - "8550:8550"
    volumes:
      # Persist the app's local stores (calendar_events.json, chat_history.json, chroma_db).
      - appdata:/root/.maicampus

volumes:
  pgdata:
  appdata:
