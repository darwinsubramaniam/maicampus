[project]
name = "maicampus"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "darwinsubramaniam", email = "darwinsubramaniam@gmail.com" }
]
dependencies = [
    "anthropic>=0.94.0",
    "chromadb>=1.5.7",
    "flet>=0.84.0",
    "google-genai>=1.72.0",
    "mem0ai>=1.0.11",
    "openai>=2.31.0",
    "tinydb>=4.8.2",
]

[dependency-groups]
dev = [
    "flet-cli>=0.84.0",
    "flet-desktop>=0.84.0",
    "flet-web>=0.84.0",
]

[tool.flet]
org = "com.mycompany"
product = "maicampus"
company = "maicampus"
copyright = "Copyright (C) 2023-2026 by maicampus. All rights reserved."

[tool.flet.app]
path = "src"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E731",  # allow lambda assignments — used for lightweight callbacks
]

[tool.ruff.lint.isort]
known-first-party = [
    "ai_providers",
    "bootstrap",
    "campus_calendar",
    "chat",
    "memory",
    "planner",
    "settings",
    "tools",
    "services",
    "theme",
]
