[project]
name = "maicampus"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "darwinsubramaniam", email = "darwinsubramaniam@gmail.com" }
]
dependencies = [
    "anthropic>=0.94.0",
    "chromadb>=1.5.7",
    "flet>=0.84.0",
    "google-genai>=1.72.0",
    "mem0ai>=1.0.11",
    "openai>=2.31.0",
    "tinydb>=4.8.2",
]

[dependency-groups]
